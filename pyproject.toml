[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-blog-archive"
version = "0.2.0"
description = "Archive Naver Blog posts as Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "markdown-it-py>=3,<5",
    "playwright>=1.45",
    "requests>=2.31",
    "Pillow>=10",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
]

[project.scripts]
naver-blog-archive = "naver_blog_archive.cli:main"

[project.gui-scripts]
naver-blog-archive-gui = "naver_blog_archive.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
