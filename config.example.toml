blog_id = "tmdejr1267"
out_dir = "naver_blog_backup"
delay = 0.5
download_images = true
# PDF·Excel·ZIP 등 글에 첨부된 파일도 저장합니다. 이미지 저장과 별도 설정입니다.
download_files = true
follow_sources = true

# 상대 out_dir는 이 설정 파일 위치를 기준으로 해석합니다.
# 기본값은 인용 원본을 한 단계까지만 저장합니다 (0~3).
source_depth = 1
# 요청 최대 시도 횟수와 요청/렌더링 제한 시간(초)
retries = 3
timeout = 30
max_image_mb = 30
# 첨부파일 하나당 최대 크기 (MiB, 1~2048). 정상 저장된 파일은 다시 사용합니다.
max_file_mb = 100
max_pages = 10000
